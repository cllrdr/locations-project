<!DOCTYPE html>
<html lang="ru">

<head>
    <meta charset="UTF-8">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Zen+Kurenaido&display=swap" rel="stylesheet">
    <title>Все локации</title>
    <link rel="stylesheet" href="/static/styles/styles.css">
</head>

<body>

<div class="container">

    <header class="header">
        <a href="/all-locations"><button class="nav-button">Все локации</button></a>
    </header>

    {{ if .is404 }}
    <div class="error-message">
        <h1>Кто-то уже выбирал себе локации, но это не точно ...</h1>
    </div>
    {{ end }}

    <form action="/all-locations" method="GET" class="search-form">
        <input type="text" name="location-search" class="search-input" placeholder="Поиск локации..." value="{{ .query }}">
        <button type="submit" class="search-btn">Поиск</button>
    </form>

    <div class="cards-grid">
        {{ range .locations }}
        <div class="card">
            <div class="card-click-area" onclick="location.href='/location/{{ .ID }}'">
                <img src="{{ .ImagePath.String }}" class="card-image">
                <div class="card-content">
                    <div class="card-title">{{ .Name }}</div>
                    <div class="card-description">{{ .Description }}</div>
                </div>
            </div>
            <div class="card-buttons">
                <form action="/locations/{{ .ID }}/add-to-cart" method="POST">
                    <button type="submit" class="card-btn">Выбрать</button>
                </form>
            </div>
        </div>
        {{ end }}
    </div>

</div>

{{ if eq .draftRequestID 0 }}
<a href="#" class="favorites-float disabled"><img src="/static/img/cart.png" alt="Мои предпочтения"></a>
{{ else }}
<a href="/fav-locations/{{ .draftRequestID }}" class="favorites-float">
    <img src="/static/img/cart.png" alt="Мои предпочтения">
    <span class="cart-count">{{ .locationsCount }}</span>
</a>
{{ end }}

</body>
</html>
